<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>KKK EXCHANGE - WhatsApp</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Segoe UI",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  overflow-x:hidden;
}

body{
  background:#090909;
  color:#fff;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
}

/* ================= HEADER ================= */

header{
  background:#0b0b0b;
  border-bottom:1px solid rgba(212,170,65,.25);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  position:sticky;
  top:0;
  z-index:10;
}

.logo-row{
  display:flex;
  align-items:center;
  gap:11px;
}

.wa-icon{
  width:35px;
  height:35px;
  border-radius:50%;
  background:#25D366;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 0 14px rgba(37,211,102,.25);
}

.wa-icon svg{
  width:21px;
  height:21px;
  fill:#fff;
}

.brand-name{
  font-size:21px;
  font-weight:800;
  letter-spacing:1px;
  color:#f1d27a;
}

/* ================= MAIN ================= */

main{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:45px 20px 55px;

  background:
    radial-gradient(
      circle at 50% 28%,
      rgba(211,168,57,.12),
      transparent 30%
    ),
    linear-gradient(
      180deg,
      #111111 0%,
      #090909 100%
    );
}

/* ================= KKK LOGO ================= */

.logo-box{
  width:min(330px,90vw);
  text-align:center;
}

.kkk-logo{
  width:100%;
  height:auto;
  display:block;
  filter:
    drop-shadow(0 0 8px rgba(212,170,65,.15))
    drop-shadow(0 8px 20px rgba(0,0,0,.6));
}

.gold-main{
  fill:url(#goldGradient);
}

.gold-dark{
  fill:url(#darkGold);
}

.gold-shine{
  fill:url(#shineGradient);
}

.logo-subtitle{
  margin-top:5px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(30px,8vw,43px);
  font-weight:700;
  letter-spacing:.35em;
  padding-left:.35em;
  color:#d5aa45;
  text-shadow:
    0 2px 8px rgba(0,0,0,.8);
}

/* ================= TAGLINE ================= */

.tagline{
  margin-top:27px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(20px,5vw,27px);
  font-weight:600;
  letter-spacing:3px;
  color:#f0d27b;
  text-align:center;
  text-transform:uppercase;
}

.divider{
  width:min(310px,75vw);
  height:2px;
  margin:27px auto 0;

  background:linear-gradient(
    90deg,
    transparent,
    #8e6a25,
    #f1d27a,
    #8e6a25,
    transparent
  );

  box-shadow:0 0 8px rgba(220,175,70,.35);
}

/* ================= DESCRIPTION ================= */

.description{
  margin-top:28px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(14px,4vw,18px);
  letter-spacing:4px;
  color:#b9933c;
  text-align:center;
  text-transform:uppercase;
}

/* ================= WHATSAPP BUTTON ================= */

.cta{
  margin-top:38px;
  width:100%;
  max-width:360px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;

  padding:17px 20px;

  background:linear-gradient(
    135deg,
    #19c879,
    #0b9f5c
  );

  border:1px solid rgba(255,255,255,.12);
  border-radius:16px;

  color:#fff;
  text-decoration:none;

  font-size:20px;
  font-weight:700;

  box-shadow:
    0 7px 25px rgba(20,190,105,.25),
    inset 0 1px 0 rgba(255,255,255,.2);

  transition:
    transform .15s ease,
    box-shadow .15s ease;
}

.cta svg{
  width:29px;
  height:29px;
  fill:#fff;
}

.cta:active{
  transform:scale(.97);
}

/* ================= PREFILL ================= */

.prefill{
  margin-top:30px;
  font-size:17px;
  color:#858585;
  text-align:center;
}

/* ================= FOOTER ================= */

footer{
  background:#050505;
  border-top:1px solid rgba(212,170,65,.2);
  color:#ddd;
  padding:30px 20px calc(18px + env(safe-area-inset-bottom));
  text-align:center;
}

.footer-brand{
  font-family:Georgia,"Times New Roman",serif;
  font-size:24px;
  font-weight:700;
  letter-spacing:5px;
  color:#d7ad4d;
}

.footer-exchange{
  margin-top:6px;
  font-size:12px;
  letter-spacing:7px;
  color:#8e6a28;
}

.footer-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px 24px;
  max-width:420px;
  margin:27px auto 0;
  font-size:15px;
}

.footer-grid a{
  color:#c9c9c9;
  text-decoration:none;
  padding:4px 0;
}

.copyright{
  margin-top:25px;
  font-size:12px;
  color:#666;
}

/* ================= DESKTOP ================= */

@media(min-width:600px){

  .cta:hover{
    transform:translateY(-3px);

    box-shadow:
      0 12px 30px rgba(20,190,105,.35),
      inset 0 1px 0 rgba(255,255,255,.2);
  }

  .logo-box{
    width:370px;
  }
}
</style>
